name: GitHub Classroom Workflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  # Keep Compose image names identical on the build and test runners.
  COMPOSE_PROJECT_NAME: lab3-rsoi-ci

jobs:
  checks:
    name: Formatting and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check vet

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
        with:
          # docker image save requires images in the local Docker image store.
          driver: docker
      - name: Build images
        timeout-minutes: 10
        # Explicit service names prevent a successful no-op with a postgres-only Compose file.
        run: docker compose build gateway reservation payment loyalty
      - name: Archive Docker images
        run: |
          docker image save --output "$RUNNER_TEMP/service-images.tar" \
            "${COMPOSE_PROJECT_NAME}-gateway" \
            "${COMPOSE_PROJECT_NAME}-reservation" \
            "${COMPOSE_PROJECT_NAME}-payment" \
            "${COMPOSE_PROJECT_NAME}-loyalty"
      - uses: actions/upload-artifact@v4
        with:
          name: service-images
          path: ${{ runner.temp }}/service-images.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  unit:
    name: Go unit tests
    services:
      rabbitmq:
        image: rabbitmq:4.2-management
        env:
          RABBITMQ_DEFAULT_USER: booking
          RABBITMQ_DEFAULT_PASS: booking
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running" --health-interval 5s
          --health-timeout 10s --health-retries 30
    env:
      RABBITMQ_TEST_URL: amqp://booking:booking@localhost:5672/
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-race

  integration:
    name: PostgreSQL and E2E tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: service-images
          path: ${{ runner.temp }}
      - name: Load images and start services
        run: |
          docker image load --input "$RUNNER_TEMP/service-images.tar"
          docker compose up -d --no-build --pull missing --wait --wait-timeout 120
      - name: Prepare repository test databases
        run: |
          for service in reservation payment loyalty; do
            docker compose exec -T postgres psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${service}_test OWNER ${service}_service"
            docker compose run --rm --no-deps --pull never --entrypoint /goose "$service" -dir /migrations postgres "postgres://${service}_service:test@postgres:5432/${service}_test?sslmode=disable" up
          done
      - name: PostgreSQL tests
        run: make test-integration
        env:
          RESERVATION_TEST_DATABASE_URL: postgres://reservation_service:test@localhost:5432/reservation_test?sslmode=disable
          PAYMENT_TEST_DATABASE_URL: postgres://payment_service:test@localhost:5432/payment_test?sslmode=disable
          LOYALTY_TEST_DATABASE_URL: postgres://loyalty_service:test@localhost:5432/loyalty_test?sslmode=disable
      - name: E2E tests
        run: make test-e2e
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down -v

  autograding:
    name: Classroom autograding (Newman)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Newman
        run: npm install --global newman@6.2.1
      - uses: actions/download-artifact@v4
        with:
          name: service-images
          path: ${{ runner.temp }}
      - name: Load Docker images
        run: docker image load --input "$RUNNER_TEMP/service-images.tar"
      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d --no-build --pull missing --wait --wait-timeout 120
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050
      - name: Run API Tests
        timeout-minutes: 5
        run: ./scripts/test-script.sh
        env:
          VARIANT: v2
          SERVICE_NAME: loyalty
          PORT_NUMBER: 8050
      - name: RabbitMQ and Gateway restart recovery
        timeout-minutes: 3
        run: ./scripts/test-broker-recovery.sh
      - name: Classroom autograding
        uses: education/autograding@v1
        id: autograder
        continue-on-error: true
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v
